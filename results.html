<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="result page of a typing speed testing site where users can type on predefined settings and to know theier wpm and accuuracy, its design is minimilstic and modern"
    />
    <title>Results</title>

    <link href="css/result/result-style.css" rel="stylesheet" />

    <script
      type="module"
      src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule=""
      src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons/ionicons.js"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  </head>
  <body>
    <div id="container">
      <main>
        <div id="text">your <span>results</span></div>
        <div id="situation">
          <span id="difficulty">easy</span> &bull;
          <span id="time">30s</span> &bull; <span id="lang">english</span>
        </div>

        <div id="data">
          <div id="stats">
            <div class="wpm-box box">
              <div id="wpm" class="number"></div>
              <div class="stat-heading stat-heading-wpm">words per minute</div>
            </div>

            <div id="data-stats">
              <div class="total-keys-box box">
                <div id="total-keys" class="number"></div>
                <div class="stat-heading">keystrokes</div>
              </div>
              <div class="correct-keys-box box">
                <div id="correct-keys" class="number"></div>
                <div class="stat-heading">correct</div>
              </div>
              <div class="correct-keys-box box">
                <div id="wrong-keys" class="number"></div>
                <div class="stat-heading">wrong</div>
              </div>
            </div>
          </div>

          <div class="accuracy-box">
            <div class="another-box">
              <div class="stat-heading">
                <span>accuracy</span>
                <span class="info">
                  <ion-icon id="info" name="information-circle"></ion-icon>
                  <span class="tooltip">correct / keystrokes</span>
                </span>
              </div>
              <div id="percent">0%</div>
            </div>

            <div id="progress-track">
              <div id="progress"></div>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <ion-icon name="refresh" class="icon" id="play-again"></ion-icon>
        <ion-icon name="download" class="icon" id="download"></ion-icon>
        <ion-icon
          name="contact"
          class="icon"
          id="contact"
          onclick="
            window.open(
              'https://www.linkedin.com/in/ronak-raj-732ba6381/',
              '_blank',
            )
          "
        ></ion-icon>
        <ion-icon
          name="cafe"
          class="icon"
          id="coffee"
          onclick="
            window.open(
              'https://youtu.be/QDia3e12czc?si=6HjNMHjzuJgKvr4Z',
              '_blank',
            )
          "
        ></ion-icon>
      </footer>
    </div>
    <script src="js/result/script-result.js"></script>
  </body>
</html>
