<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="its a typing speed testing site where users can type on predefined settings and know theier wpm and accuuracy, its design is minimilstic and modern"
    />
    <title>speed-write-test</title>

    <link href="css/index/style.css" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <div class="logo">speed🗲test</div>
      <div class="options">
        <div class="menu" id="difficulty">
          <div class="name">
            difficulty
            <div class="dropdown-menu">
              <div class="option">easy</div>
              <div class="option">medium</div>
              <div class="option">hard</div>
            </div>
          </div>
        </div>
        <div class="menu" id="time">
          <div class="name">
            time
            <div class="dropdown-menu time-menu">
              <div class="option">30s</div>
              <div class="option">60s</div>
              <div class="option">90s</div>
              <div class="option">120s</div>
            </div>
          </div>
        </div>
        <div class="menu" id="language">
          <div class="name">
            language
            <div class="dropdown-menu">
              <div class="option">english</div>
              <div class="option">हिन्दी</div>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="container">
      <input
        id="hidden-input"
        type="text"
        id="hidden-input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        data-form-type="other"
        data-lpignore="true"
      />
      <div class="speed-dial">30s</div>
      <main class="text-container"></main>
    </div>
    <script src="js/index/script.js"></script>
  </body>
</html>
